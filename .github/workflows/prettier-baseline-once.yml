name: One-time Prettier Baseline

on:
  push:
    branches:
      - style/frontend-prettier-baseline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/frontend-prettier-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply pinned Prettier baseline
        working-directory: frontend
        run: npm run format
      - name: Commit mechanical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(frontend): apply Prettier baseline"
          git push origin HEAD:style/frontend-prettier-baseline
