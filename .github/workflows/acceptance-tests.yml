name: Acceptance Tests

# Golden-path acceptance against PostgreSQL (service container).
# Uses ACCEPTANCE_DATABASE_URL so Testcontainers/Docker-in-Docker is not required.
# Invokes scripts/test/run.sh so local and CI share one entrypoint.
# Complements backend-tests.yml (unit/api) and code-quality.yml (frontend).

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'fixtures/**'
      - 'scripts/staging/**'
      - 'scripts/test/**'
      - '.github/workflows/acceptance-tests.yml'
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'fixtures/**'
      - 'scripts/staging/**'
      - 'scripts/test/**'
      - '.github/workflows/acceptance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: backend acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.13
        env:
          POSTGRES_USER: patchhive
          POSTGRES_PASSWORD: patchhive_test
          POSTGRES_DB: patchhive_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backend[dev]
        working-directory: backend
        run: python -m pip install -e '.[dev]'

      - name: Make runners executable
        run: chmod +x scripts/test/run.sh scripts/staging/*.sh

      - name: Acceptance via unified runner
        env:
          ACCEPTANCE_DATABASE_URL: postgresql://patchhive:patchhive_test@localhost:5432/patchhive_acceptance
          ACCEPTANCE_EXPORT_DIR: ${{ github.workspace }}/tmp/acceptance-exports
          TEST_MODE: 'true'
          STRIPE_TEST_MODE: 'true'
          ALLOW_PRODUCTION_PAYMENTS: 'false'
        run: bash scripts/test/run.sh acceptance
